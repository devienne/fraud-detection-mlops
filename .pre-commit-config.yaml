# Checks that run automatically on `git commit` (install once with: pre-commit install).
# A failing check blocks the commit and shows why. Run on everything: pre-commit run --all-files

# Files generated by the DVC pipeline are never edited by hand or by hooks (dvc.lock records their hash).
exclude: ^(reports/|dvc\.lock$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files      # stop datasets/models from entering git by accident
        args: ["--maxkb=1000"]
      - id: check-merge-conflict         # no leftover <<<<<<< markers
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6                         # same version as in requirements-dev.txt
    hooks:
      - id: ruff-check                   # lint (real bugs, imports, modern syntax)
        args: ["--fix"]
