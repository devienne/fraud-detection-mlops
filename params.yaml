# Single source of truth for every tunable setting of the pipeline.
# DVC tracks the sections each stage uses, so changing a value re-runs only the affected stages.

data:
  history_path: data/raw/transacoes_historico_2025.csv   # labelled 2025 transactions
  scoring_path: data/raw/transacoes_jan2026.csv           # unlabelled January 2026 transactions
  timestamp_col: datahora_transacao
  target: flag_fraude

features:
  # Model input columns, in the exact order the model expects (training and serving share it).
  columns: [hour, tipo_estabelecimento, nome_estabelecimento, cidade, device_type, is_new_device, valor_transacao]
  categorical: [tipo_estabelecimento, nome_estabelecimento, cidade, device_type]

split:                       # time-based: the model always scores the future
  train_months: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  validation_months: [10, 11]   # early stopping and threshold selection
  test_months: [12]             # untouched final evaluation

model:
  learning_rate: 0.03
  num_leaves: 15
  min_child_samples: 500
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
  random_state: 42
  max_estimators: 3000
  early_stopping_rounds: 150
  final_trees_multiplier: 1.2   # more data in the final fit -> ~20% more trees
  recency_months: [12]          # months up-weighted in the final fit (December drift)
  recency_weight: 3.0

policy:                      # turns scores into decisions
  false_block_cost: 10.0     # R$ cost assumed for blocking a legitimate transaction
  threshold_grid: {start: 0.01, stop: 0.91, step: 0.01}
  review_recall_target: 0.95 # High + Medium bands must capture this share of validation fraud

quality_gate:               # minimum standard a model must meet on the test month to be released
  min_test_pr_auc: 0.60      # current model: 0.618
  min_lift_over_rule: 1.5    # test PR-AUC must be >= 1.5x the rule baseline's (current: 2.0x)
  min_recall_at_block: 0.50  # share of test fraud blocked (current: 0.63)
  min_precision_at_block: 0.40  # share of blocks that are real fraud (current: 0.59)

monitoring:                 # drift checks of a window of recent transactions vs the training reference
  numeric_bins: 10           # quantile bins (from the reference) for continuous features and scores
  top_categories: 20         # most frequent reference values kept as their own bin; the rest pooled as "other"
  psi_warn: 0.10             # PSI rule of thumb: < 0.10 stable, 0.10-0.25 watch, > 0.25 act
  psi_alert: 0.25
  score_percentiles: [0.50, 0.90, 0.95, 0.99]
  segments: [tipo_estabelecimento, device_type, cidade, hour]   # few, fixed values each
  label_maturity_days: 30    # fraud is reported late: only older transactions have final labels
  min_segment_frauds: 30     # compare a segment's recall only with enough fraud on both sides (noise)
  max_pr_auc_drop: 0.10      # alert if PR-AUC falls this much below the baseline (absolute)
  max_recall_drop: 0.10      # alert if recall at the block threshold falls this much (overall or segment)
  max_fraud_share_shift: 0.15  # alert if a segment's share of all fraud moves this much (fraud pattern change)

retrain:                    # challenger training, from labels matured by an "as of" date
  holdout_days: 14           # most recent matured days: held out for champion vs challenger (never trained on)
  validation_days: 14        # the days before the holdout: early stopping (and, next, thresholds)
  train_window_days: 365     # how far back the challenger's training data goes
  recent_days: 30            # last days of the training window up-weighted (fraud patterns move)
  recent_weight: 3.0
  # Promotion rule: the challenger must clear ALL of these on the holdout to be recommended.
  min_pr_auc_gain: 0.01      # overall PR-AUC gain over the champion...
  bootstrap_samples: 500     # ...and the gain's 95% bootstrap interval must be above 0 (not noise)
  max_segment_recall_drop: 0.05   # no segment (with >= monitoring.min_segment_frauds frauds) loses more recall
  max_false_block_rate_increase: 0.005  # legitimate transactions blocked: at most +0.5 point (customer impact)

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: fraud-detection
  registered_model: fraud-lightgbm
